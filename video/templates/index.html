<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прямая трансляция</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #111827;
            --light: #f9fafb;
            --gray: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            padding: 20px 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--gray);
            font-size: 14px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            aspect-ratio: 16/9;
        }

        #videoFrame {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .timestamp {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            color: white;
        }

        .motion-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(239, 68, 68, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            display: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #374151;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .status-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .status-label {
            font-size: 14px;
            color: var(--gray);
            font-weight: 500;
        }

        .admin-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            
            .status-bar {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1f2937;
            color: var(--gray);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Прямая трансляция</h1>
            <p>Видеонаблюдение в реальном времени</p>
        </div>

        <div class="video-wrapper">
            <div id="videoContainer">
                <img id="videoFrame" src="" alt="Видеопоток">
                <div class="video-placeholder" id="videoPlaceholder">
                    Камера неактивна
                </div>
            </div>
            
            <div class="overlay">
                <div class="timestamp" id="timestamp">--:--:--</div>
                <div class="motion-indicator" id="motionIndicator">
                    ⚠️ Обнаружено движение
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startCamera()">
                ▶ Запустить трансляцию
            </button>
            <button class="btn btn-secondary" onclick="stopCamera()">
                ⏹ Остановить
            </button>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="cameraStatus">Выкл</div>
                <div class="status-label">Камера</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="clientsCount">0</div>
                <div class="status-label">Зрители</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="motionEvents">0</div>
                <div class="status-label">События</div>
            </div>
        </div>

        <div class="admin-link">
            <a href="/admin" target="_blank">
                ⚙️ Панель управления
            </a>
        </div>
    </div>

    <script>
        let ws = null;
        let cameraActive = false;
        let lastMotionTime = 0;

        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ru-RU');
            document.getElementById('timestamp').textContent = timeStr;
        }

        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const statusElem = document.getElementById('cameraStatus');
                    statusElem.textContent = data.camera_active ? 'Вкл' : 'Выкл';
                    statusElem.style.color = data.camera_active ? '#10b981' : '#ef4444';
                    
                    document.getElementById('clientsCount').textContent = data.clients_connected;
                    document.getElementById('motionEvents').textContent = data.motion_events;
                    
                    cameraActive = data.camera_active;
                    
                    // Показываем/скрываем плейсхолдер
                    const placeholder = document.getElementById('videoPlaceholder');
                    const videoFrame = document.getElementById('videoFrame');
                    if (data.camera_active) {
                        placeholder.style.display = 'none';
                        videoFrame.style.display = 'block';
                    } else {
                        placeholder.style.display = 'flex';
                        videoFrame.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Ошибка при обновлении статуса:', error);
                });
        }

        function startCamera() {
            fetch('/api/camera/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data.message);
                    updateStatus();
                    connectWebSocket();
                });
        }

        function stopCamera() {
            fetch('/api/camera/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data.message);
                    updateStatus();
                    if (ws) {
                        ws.close();
                        ws = null;
                    }
                });
        }

        function connectWebSocket() {
            if (ws) return;
            
            ws = new WebSocket(`ws://${window.location.host}/ws`);
            
            ws.onopen = function() {
                console.log('WebSocket подключен');
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'frame') {
                        // Обновление видео
                        document.getElementById('videoFrame').src = 
                            'data:image/jpeg;base64,' + data.data;
                        
                        // Проверка на движение
                        if (data.motion_detected) {
                            showMotionIndicator();
                        }
                    }
                } catch (error) {
                    console.error('Ошибка обработки WebSocket сообщения:', error);
                }
            };
            
            ws.onclose = function() {
                console.log('WebSocket отключен, переподключение...');
                ws = null;
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket ошибка:', error);
                ws.close();
            };
        }

        function showMotionIndicator() {
            const indicator = document.getElementById('motionIndicator');
            indicator.style.display = 'block';
            lastMotionTime = Date.now();
            
            // Скрыть индикатор через 5 секунд
            setTimeout(() => {
                if (Date.now() - lastMotionTime >= 5000) {
                    indicator.style.display = 'none';
                }
            }, 5000);
        }

        // Инициализация
        updateTimestamp();
        updateStatus();
        
        // Автоматическое обновление
        setInterval(updateTimestamp, 1000);
        setInterval(updateStatus, 5000);
        
        // Автозапуск при загрузке страницы
        window.addEventListener('load', function() {
            updateStatus();
            // Автоматически подключаемся, если камера уже запущена
            setTimeout(() => {
                if (cameraActive && !ws) {
                    connectWebSocket();
                }
            }, 1000);
        });
    </script>
</body>
</html>
